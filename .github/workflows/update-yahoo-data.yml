
name: Update Yahoo Fantasy data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: yahoo-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Yahoo league data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          base = "https://pub-api-ro.fantasysports.yahoo.com/fantasy/v2"
          league = "nba.l.10203"
          paths = {
              "standings": f"league/{league}/standings",
              "scoreboard": f"league/{league}/scoreboard",
              "teams": f"league/{league}/teams",
              "transactions": f"league/{league}/transactions",
              "players": f"league/{league}/players;start=0;count=25",
          }

          def convert(element):
              children = list(element)
              if not children:
                  return (element.text or "").strip()
              result = {}
              for child in children:
                  key = child.tag.split("}")[-1]
                  value = convert(child)
                  if key in result:
                      if not isinstance(result[key], list):
                          result[key] = [result[key]]
                      result[key].append(value)
                  else:
                      result[key] = value
              if element.attrib:
                  result["_attributes"] = element.attrib
              return result

          data = {
              "league_id": "10203",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "endpoints": {},
          }
          failed = []

          for name, path in paths.items():
              url = f"{base}/{path}"
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 FantasyInfoStation/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                  root = ET.fromstring(raw)
                  data["endpoints"][name] = {
                      "ok": True,
                      "data": convert(root)
                  }
                  print(f"{name}: OK ({len(raw)} bytes)")
              except Exception as exc:
                  failed.append(name)
                  data["endpoints"][name] = {
                      "ok": False,
                      "error": str(exc)
                  }
                  print(f"{name}: FAILED: {exc}")

          with open("data.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          if len(failed) == len(paths):
              raise SystemExit("All Yahoo endpoints failed.")
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update Yahoo Fantasy data"
            git push
          fi
